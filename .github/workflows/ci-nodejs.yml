name: NodeJS app
on:
  push:
      branches:
        - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - 
        name: Checkout
        uses: actions/checkout@v7
        with:
          repository: https://github.com/PXL-2TIN-DevOps-Resources/calculator-app-finished

      -
        name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '20'

      -
        name: check unit tests & report
        run: |
          npm install
          npm test -- --coverage --coverageReporters=lcov
          
      - name: Better Test Reports Action
        uses: mridang/action-test-reporter@v3.0.1
        with:
          name: Unit tests
          coverage-path: coverage/lcov.info

      
