name: Docker app
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - 
        name: Checkout
        uses: actions/checkout@v7
        with:
          repository: PXL-2TIN-DevOps-Resources/calculator-app-finished

      - 
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      -
        name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '20'

      -
        name: check unit tests & report
        run: |
          npm install
          npm test -- --coverage --coverageReporters=lcov
          
      - name: Better Test Reports Action
        uses: mridang/action-test-reporter@v3.0.1
        with:
          name: Unit tests
          coverage-path: coverage/lcov.info

      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/app:latest
            ${{ vars.DOCKERHUB_USERNAME }}/app:${{ github.ref_name }} 

      -
        name: Automatische Scan naar CVEs
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ vars.DOCKERHUB_USERNAME }}/app:latest
          only-fixed: true

      
